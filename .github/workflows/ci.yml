name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.19.0, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Geo runtime
        run: python -m pip install -e "./backend/geo-service[test]"

      - name: Verify documentation
        run: pnpm run check:docs

      - name: Verify TypeScript and peer dependencies
        run: pnpm run typecheck && pnpm peers check

      - name: Run complete test suite
        run: pnpm test

      - name: Verify Demo media
        run: pnpm run check:media
